name: Feature request
description: Propose a modelling, evaluation, or engineering improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: statistical
    attributes:
      label: Statistical considerations
      description: Assumptions, estimation implications, validation requirements, or alternatives.
